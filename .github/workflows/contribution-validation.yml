name: contribution validation (fork only)

on:
  push:
    branches: [audit/pgbot-validation-20260922]

permissions:
  contents: write

concurrency:
  group: pgbot-reset-candidate-validation
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'DivyamTalwar/pgbot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Prepare exact upstream baseline and regression tests
        run: |
          cp audit/reset-safe-diff.patch "$RUNNER_TEMP/candidate.patch"
          git checkout --detach a1e6561e366455756c45a16a46647f882b3b6a1c
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply --include=internal/diff/reset_regression_test.go --include=internal/render/diff_reset_regression_test.go --include=cmd/pgbot/diff_reset_regression_test.go "$RUNNER_TEMP/candidate.patch"
      - name: Prove actual regressions fail before the fix
        run: |
          set +e
          go test -json ./internal/diff ./internal/render ./cmd/pgbot -run '^(TestCompute_SuppressesResetCrossingComparisons|TestDiffReport_ResetDoesNotClaimNothingChanged|TestDiffReport_ResetDoesNotPresentCumulativeDelta|TestResolveDiff_ResetSafeJSON)$' > "$RUNNER_TEMP/red.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/red.jsonl"
          test "$result" -ne 0
          python3 - <<'PY'
          import json, os
          expected = {
              'TestCompute_SuppressesResetCrossingComparisons',
              'TestDiffReport_ResetDoesNotClaimNothingChanged',
              'TestDiffReport_ResetDoesNotPresentCumulativeDelta',
              'TestResolveDiff_ResetSafeJSON',
          }
          failed = set()
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'red.jsonl')) as stream:
              for line in stream:
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if event.get('Action') == 'fail' and '/' not in event.get('Test', ''):
                      failed.add(event.get('Test', ''))
          assert expected <= failed, (expected, failed)
          print('Confirmed all four expected regression tests fail on upstream, including the real SQLite/JSON path.')
          PY
      - name: Apply fix and prove targeted regressions pass
        run: |
          git apply --include=internal/diff/diff.go --include=internal/render/diff.go "$RUNNER_TEMP/candidate.patch"
          gofmt -w internal/diff/diff.go internal/render/diff.go internal/diff/reset_regression_test.go internal/render/diff_reset_regression_test.go cmd/pgbot/diff_reset_regression_test.go
          go test -v ./internal/diff ./internal/render ./cmd/pgbot -run '^(TestCompute_(SuppressesResetCrossingComparisons|KeepsComparableSnapshots|MissingBaselineRemainsUnavailable)|TestDiffReport_(ResetDoesNotClaimNothingChanged|ResetDoesNotPresentCumulativeDelta|NoResetStillReportsCleanComparison|NoResetStillReportsChanges|EvictionCaveatStillVisible)|TestResolveDiff_ResetSafeJSON)$'
      - name: Commit only the five reviewed production and test files
        run: |
          git config user.name 'Divyam Talwar'
          git config user.email '194859478+DivyamTalwar@users.noreply.github.com'
          git add internal/diff/diff.go internal/render/diff.go internal/diff/reset_regression_test.go internal/render/diff_reset_regression_test.go cmd/pgbot/diff_reset_regression_test.go
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --check
          git commit -m 'fix(diff): suppress misleading comparisons across statistics resets'
      - name: Install repository-pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Gate the exact candidate commit before pushing
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash scripts/gate.sh
      - name: Full race suite and repeated real-store regression
        run: |
          go test -race ./...
          go test ./cmd/pgbot -run '^TestResolveDiff_ResetSafeJSON$' -count=25
      - name: Dependency vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Publish validated candidate branch in this fork only
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(git status --porcelain)"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/reset-safe-diff-20260922
          echo "Validated candidate: $(git rev-parse HEAD)"
          git show --stat --oneline HEAD
