name: contribution validation (fork only)

on:
  push:
    branches: [audit/pgbot-validation-20260922]

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'DivyamTalwar/pgbot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Install repository-pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Validate committed HEAD with repository gate
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          git status --porcelain
          bash scripts/gate.sh
      - name: Race detector
        run: go test -race ./...
